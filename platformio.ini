[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -std=c++17
    -Wall
    -Wextra
lib_deps =
    WebServer
    SPIFFS
    Update
libdeps_class = 
    WireGuard
    ArduinoOTA

[env:debug]
inherits = esp32-c3-devkitc-02
build_flags = 
    ${env:esp32-c3-devkitc-02.build_flags}
    -DDEBUG=1
    -O0
    -g

[env:release]
inherits = esp32-c3-devkitc-02
build_flags = 
    ${env:esp32-c3-devkitc-02.build_flags}
    -O3
    -DNDEBUG
